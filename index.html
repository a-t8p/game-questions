setColors();render();
</script>
<script id="hydrangea-functions">
(()=>{
const toggle=document.getElementById('hydrangeaToggle'),panel=document.getElementById('hydrangeaPanel');
const close=()=>{panel.hidden=true;toggle.setAttribute('aria-expanded','false')};
let dragged=false, startX=0, startY=0, startLeft=0, startTop=0, pointerDown=false;
const posKey='hydrangea-floating-icon-position-v1';
try{const saved=JSON.parse(localStorage.getItem(posKey)||'null');if(saved&&Number.isFinite(saved.left)&&Number.isFinite(saved.top)){toggle.style.left=Math.max(0,Math.min(innerWidth-toggle.offsetWidth,saved.left))+'px';toggle.style.top=Math.max(0,Math.min(innerHeight-toggle.offsetHeight,saved.top))+'px';toggle.style.right='auto';toggle.style.bottom='auto'}}catch{}
function placePanel(){const r=toggle.getBoundingClientRect(), w=Math.min(300,innerWidth-30), h=panel.offsetHeight||220;let left=Math.max(15,Math.min(innerWidth-w-15,r.left+r.width/2-w/2));let top=r.top>h+25?r.top-h-12:Math.min(innerHeight-h-12,r.bottom+12);panel.style.left=left+'px';panel.style.top=Math.max(12,top)+'px';panel.style.right='auto';panel.style.bottom='auto'}
toggle.addEventListener('pointerdown',e=>{pointerDown=true;dragged=false;const r=toggle.getBoundingClientRect();startX=e.clientX;startY=e.clientY;startLeft=r.left;startTop=r.top;toggle.setPointerCapture(e.pointerId);toggle.classList.add('dragging');toggle.style.left=r.left+'px';toggle.style.top=r.top+'px';toggle.style.right='auto';toggle.style.bottom='auto'});
toggle.addEventListener('pointermove',e=>{if(!pointerDown)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>5||Math.abs(dy)>5)dragged=true;if(dragged){const left=Math.max(0,Math.min(innerWidth-toggle.offsetWidth,startLeft+dx));const top=Math.max(0,Math.min(innerHeight-toggle.offsetHeight,startTop+dy));toggle.style.left=left+'px';toggle.style.top=top+'px';if(!panel.hidden)placePanel()}});
function endDrag(){if(!pointerDown)return;pointerDown=false;toggle.classList.remove('dragging');if(dragged){try{localStorage.setItem(posKey,JSON.stringify({left:parseFloat(toggle.style.left),top:parseFloat(toggle.style.top)}))}catch{};if(!panel.hidden)placePanel()}}
toggle.addEventListener('pointerup',endDrag);toggle.addEventListener('pointercancel',endDrag);
toggle.addEventListener('click',e=>{if(dragged){e.preventDefault();e.stopPropagation();dragged=false;return}panel.hidden=!panel.hidden;toggle.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)placePanel()});
window.addEventListener('resize',()=>{const r=toggle.getBoundingClientRect();const left=Math.max(0,Math.min(innerWidth-toggle.offsetWidth,r.left));const top=Math.max(0,Math.min(innerHeight-toggle.offsetHeight,r.top));toggle.style.left=left+'px';toggle.style.top=top+'px';toggle.style.right='auto';toggle.style.bottom='auto';try{localStorage.setItem(posKey,JSON.stringify({left,top}))}catch{};if(!panel.hidden)placePanel()});
document.getElementById('hydClose').onclick=close;
document.addEventListener('click',e=>{if(!panel.contains(e.target)&&!toggle.contains(e.target))close()});
document.getElementById('hydEdit').onclick=()=>{close();document.querySelector('.settings').scrollIntoView({behavior:'smooth'});};
document.getElementById('hydSearch').onclick=()=>{close();document.getElementById('hydrangeaQuery').focus();};
const search=document.getElementById('hydrangeaQuery');
search.addEventListener('input',()=>{const term=search.value.trim().toLocaleLowerCase();document.querySelectorAll('#list .item').forEach(card=>{const title=card.querySelector('h2')?.textContent||'';const opts=Array.from(card.querySelectorAll('.choice-a,.choice-b')).map(x=>x.textContent).join(' ');card.style.display=(title+' '+opts).toLocaleLowerCase().includes(term)?'':'none'})});
function download(filename,contents,type){const blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
document.getElementById('hydExport').onclick=()=>{download('slamon_questions.txt',JSON.stringify(state,null,2),'text/plain;charset=utf-8');close()};
document.getElementById('hydImport').onclick=()=>{document.getElementById('hydFile').click()};
document.getElementById('hydFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.questions))throw Error('質問データがありません');if(!confirm('現在の質問を読み込んだデータに置き換えますか？'))return;Object.assign(state,data);save();location.reload()}catch(err){alert('読み込みに失敗しました: '+err.message)}finally{e.target.value=''}};
document.getElementById('hydRefresh').onclick=()=>{close();save();location.reload()};
document.getElementById('hydHtml').onclick=()=>{
 const copy=document.documentElement.cloneNode(true);
 copy.querySelector('#hydrangeaPanel').hidden=true;
 copy.querySelector('#hydrangeaToggle').setAttribute('aria-expanded','false');
 copy.querySelector('#list').replaceChildren();
 const q=copy.querySelector('#hydrangeaQuery');if(q)q.value='';
 const old=copy.querySelector('#embeddedStateHyd');if(old)old.remove();
 const embed=document.createElement('script');embed.id='embeddedStateHyd';
 embed.textContent='window.__HYDRANGEA_SAVED_STATE__='+JSON.stringify(state).replace(/</g,'\\u003c')+';';
 copy.querySelector('head').append(embed);
 download('index.html','<!DOCTYPE html>\n'+copy.outerHTML,'text/html;charset=utf-8');close()
};
})();
</script></body></html>
